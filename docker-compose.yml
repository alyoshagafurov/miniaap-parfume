# Local development services for ARUMI stage 1.
#
# Host ports are deliberately non-default: this machine already runs a native
# PostgreSQL on 5432, a native Redis on 6379, and another project's MinIO on
# 9000/9001. Container-internal ports stay standard.
#
#   docker compose up -d
#
# Application processes (next, bot) run on the host via pnpm during stage 1;
# they are containerised in stage 3 together with Caddy.

name: arumi

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arumi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arumi_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-arumi}
      # Russian text: force a predictable collation so ORDER BY is stable
      # across machines regardless of the host locale.
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arumi} -d ${POSTGRES_DB:-arumi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Rate-limit counters and login codes only — losing them on restart is
    # acceptable, so no persistence is configured.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Pinned rather than :latest — MinIO withdrew the :latest tag, and this
    # exact release is already present on this machine.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-arumi_dev_access}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-arumi_dev_secret}
    ports:
      - "${MINIO_PORT:-9100}:9000"
      - "${MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: create the bucket and make product images publicly readable,
  # mirroring how the production S3 bucket is configured.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_BUCKET: ${S3_BUCKET:-arumi}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-arumi_dev_access}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-arumi_dev_secret}
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do echo "waiting for minio..."; sleep 1; done &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set download "local/$$S3_BUCKET" &&
        echo "bucket $$S3_BUCKET ready"

volumes:
  postgres-data:
  minio-data:
